<!DOCTYPE html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#07120b;font-family:Arial,Helvetica,sans-serif;color:#f7fbf5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
      <tr>
        <td style="padding:24px;background:#10261a;border-radius:16px;">
          <h1 style="margin:0 0 16px;font-size:22px;color:#f7fbf5;">Leguelé Beer</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#f7fbf5;">
            Olá, {{ .Data.nome }}! Toque no botão abaixo para ativar sua conta na Leguelé Beer.
          </p>
          <p style="margin:0 0 24px;">
            <a
              href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=signup"
              style="display:inline-block;padding:14px 24px;background:#95dc50;color:#000a00;font-weight:bold;text-decoration:none;border-radius:999px;"
              >Confirmar minha conta</a
            >
          </p>
          <p style="margin:0;font-size:13px;color:#a9bfa0;">
            Leguelé Beer é um projeto de portfólio. Se você não criou esta conta, ignore este e-mail.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
