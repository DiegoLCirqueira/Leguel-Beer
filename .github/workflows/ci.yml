name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/leguele_test
      WEB_ORIGIN: http://localhost:3000
      SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Localizar o store do pnpm
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Formatação
        run: pnpm format:check

      - name: Arquitetura
        run: pnpm arch

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations em sincronia com o schema
        run: pnpm db:check

      - name: Testes de unidade (shared e web)
        run: pnpm turbo run test --filter=!@leguele/api

      - name: Testes de unidade da API com cobertura de domain e application (mínimo 80% de linhas)
        run: pnpm test:coverage

      - name: Testes de integração (banco leguele_test)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Instalar o Chromium do Playwright
        run: pnpm --filter @leguele/web exec playwright install --with-deps chromium

      # O Supabase CLI sobe só o Auth (gotrue, kong e mailpit) com o Postgres dele; a API do E2E
      # continua no Postgres do service container, que o db:check acima já deixou migrado.
      - name: Subir o Supabase local para os E2E de acesso
        run: |
          pnpm db:signing-key
          pnpm db:start -x realtime,storage-api,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # As chaves são as de desenvolvimento do Supabase CLI, não são segredos.
      - name: Exportar as chaves do Supabase local
        run: |
          status="$(pnpm exec supabase status -o env)"
          echo "SUPABASE_ANON_KEY=$(echo "$status" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_EMAILS_URL=$(echo "$status" | grep '^MAILPIT_URL=' | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"

      - name: E2E
        run: pnpm test:e2e
